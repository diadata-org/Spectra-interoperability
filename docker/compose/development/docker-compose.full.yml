version: '3.8'

services:
  # PostgreSQL database for bridge and monitor
  postgres:
    image: postgres:15-alpine
    container_name: spectra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_MULTIPLE_DATABASES: oracle_bridge,hyperlane_monitor
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5432:5432"
    networks:
      - spectra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Attestor service - publishes oracle intents to registry
  attestor:
    build:
      context: ../../../services/attestor
      dockerfile: ../../../docker/dockerfiles/attestor.Dockerfile
    container_name: spectra-attestor
    restart: unless-stopped
    environment:
      # Required environment variables
      - ATTESTOR_ATTESTOR_PRIVATE_KEY=${ATTESTOR_PRIVATE_KEY}
      - PRIVATE_KEY=${ATTESTOR_PRIVATE_KEY}
      - ATTESTOR_REGISTRY_ADDRESS=${ATTESTOR_REGISTRY_ADDRESS:-0xC1ca83b5df6ce7e21Fb462C86f0C90E182d6db5d}
      - L2_INTENT_REGISTRY_EIP712=${L2_INTENT_REGISTRY_EIP712:-0xC1ca83b5df6ce7e21Fb462C86f0C90E182d6db5d}
      
      # Optional environment variables with defaults
      - ATTESTOR_RPC_URL=${ATTESTOR_RPC_URL:-https://rpc-dia-lasernet-dipfsyyx2w.t.conduit.xyz}
      - ATTESTOR_RPC_REGISTRY_URL=${ATTESTOR_RPC_REGISTRY_URL:-https://rpc-dia-lasernet-dipfsyyx2w.t.conduit.xyz}
      - ATTESTOR_ORACLE_ADDRESS=${ATTESTOR_ORACLE_ADDRESS:-0x0087342f5f4c7AB23a37c045c3EF710749527c88}
      - ATTESTOR_ATTESTOR_SYMBOLS=${ATTESTOR_ATTESTOR_SYMBOLS:-BTC/USD,ETH/USD}
      - ATTESTOR_ATTESTOR_POLLING_TIME=${ATTESTOR_ATTESTOR_POLLING_TIME:-5s}
      - ATTESTOR_ATTESTOR_BATCH_MODE=${ATTESTOR_ATTESTOR_BATCH_MODE:-false}
      - ATTESTOR_LOGGING_LEVEL=${ATTESTOR_LOGGING_LEVEL:-info}
      - ATTESTOR_METRICS_PORT=${ATTESTOR_METRICS_PORT:-8080}
      - ATTESTOR_API_PORT=${ATTESTOR_API_PORT:-8081}
    ports:
      - "8080:8080"  # Prometheus metrics
      - "8081:8081"  # API server
    networks:
      - spectra-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Bridge service - monitors registry and routes to receivers
  bridge:
    build:
      context: ../../../services/bridge
      dockerfile: ../../../docker/dockerfiles/bridge.Dockerfile
    container_name: spectra-bridge
    restart: unless-stopped
    environment:
      - BRIDGE_PRIVATE_KEY=${BRIDGE_PRIVATE_KEY:-${OP_SEPOLIA_PRIVATE_KEY}}
      - DATABASE_URL=postgres://bridge:password@postgres:5432/oracle_bridge?sslmode=disable
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./bridge/config.json:/root/config.json:ro
    ports:
      - "8082:8080"  # API port for failover endpoint
      - "8083:8082"  # gRPC port
      - "9092:9090"  # Prometheus metrics
    networks:
      - spectra-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Hyperlane monitor - monitors message delivery and triggers failover
  hyperlane-monitor:
    build:
      context: ../../../services/hyperlane-monitor
      dockerfile: ../../../docker/dockerfiles/hyperlane-monitor.Dockerfile
    container_name: spectra-hyperlane-monitor
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://monitor:password@postgres:5432/hyperlane_monitor?sslmode=disable
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ../../../services/hyperlane-monitor/config/config.json:/app/config.json:ro
    ports:
      - "9091:9091"  # Prometheus metrics
    networks:
      - spectra-network
    depends_on:
      postgres:
        condition: service_healthy
      bridge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9091/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: spectra-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus-full.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - spectra-network
    depends_on:
      - attestor
      - bridge
      - hyperlane-monitor

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: spectra-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_LOG_LEVEL=info
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - spectra-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  spectra-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
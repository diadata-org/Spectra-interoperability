syntax = "proto3";

package bridge;

option go_package = "github.com/diadata.org/Spectra-interoperability/bridge/proto";

// The Bridge service definition
service BridgeService {
  // Trigger a failover for a message that hasn't been delivered by Hyperlane
  rpc TriggerFailover(FailoverRequest) returns (FailoverResponse);
  
  // Check the status of a failover request
  rpc GetFailoverStatus(StatusRequest) returns (StatusResponse);
  
  // Health check
  rpc HealthCheck(HealthRequest) returns (HealthResponse);
}

// Oracle intent data structure
message OracleIntent {
  string intent_type = 1;
  string version = 2;
  string chain_id = 3;  // Using string for big.Int
  string nonce = 4;     // Using string for big.Int
  string expiry = 5;    // Using string for big.Int
  string symbol = 6;
  string price = 7;     // Using string for big.Int
  string timestamp = 8; // Using string for big.Int
  string source = 9;
  bytes signature = 10;
  string signer = 11;   // Ethereum address as string
}

// Request to trigger a failover
message FailoverRequest {
  string message_id = 1;
  string intent_hash = 2;
  string pair_id = 3;
  int64 source_chain_id = 4;
  int64 destination_chain_id = 5;
  string receiver_address = 6;
  OracleIntent intent_data = 7;
  string reason = 8;
  int64 detection_timestamp = 9;
  int64 monitoring_start_timestamp = 10;
  int64 failover_timestamp = 11;
  string receiver_key = 12;
}

// Response from failover trigger
message FailoverResponse {
  string request_id = 1;
  string status = 2;
  int64 timestamp = 3;
  string message = 4;
}

// Request to check failover status
message StatusRequest {
  string request_id = 1;
}

// Response with failover status
message StatusResponse {
  string request_id = 1;
  string status = 2;
  string tx_hash = 3;
  string error_message = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
}

// Health check request
message HealthRequest {}

// Health check response
message HealthResponse {
  bool healthy = 1;
  string version = 2;
  int64 uptime_seconds = 3;
  map<string, ChainStatus> chain_status = 4;
}

// Chain connection status
message ChainStatus {
  bool connected = 1;
  int64 last_block = 2;
  string error = 3;
}
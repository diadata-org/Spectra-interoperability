# Attestor Service Configuration for Lumina (Lasernet)

# RPC Configuration
rpc:
  url: https://testnet-rpc.diadata.org
  urls:
    - https://testnet-rpc.diadata.org
  registry_url: https://testnet-rpc.diadata.org

# Oracle Configuration
oracle:
  address: "0x20E8593ab0455f4BA5D6DE4bd0408c5146781ECB"
  client_type: "dia_v2"
  # address: "0xFA3c5e662aB985317b90914305c263b6Ab02452d"
  # client_type: "guarded"

# Registry Configuration (deployed on Lasernet)
registry:
  address: "0xfBf4D9b91f0dc514b04047f2A47537b824A1BcEb"

# Attestor Configuration
attestor:
  # private_key should be set via ATTESTOR_ATTESTOR_PRIVATE_KEY environment variable
  # (only used when signing_backend is "privatekey")
  signing_backend: pkcs11
  pkcs11:
    module_path: "/opt/cloudhsm/lib/libcloudhsm_pkcs11.so"
    token_label: "hsm1"
    key_label: "attestor-key"
    public_key_label: "attestor-key-pub"
    # PIN must be set via ATTESTOR_ATTESTOR_PKCS11_PIN environment variable
    # (format: "<crypto-user-username>:<password>", e.g. "attestorcu:...")
  symbols:
    - BTC/USD
    - ETH/USD
  polling_time: 5s
  batch_mode: false
  mode: prime  # Options: prime, replica
  replica_backup_delay: 300  # Seconds to wait before replica submits 
  intent_type: OracleUpdate
  intent_version: "1.0"
  guardian:
    default:
      max_deviation_bips: 500      # 5% deviation tolerance
      max_timestamp_age: 3600      # 1 hour
      min_guardian_matches: 1      # at least 1 guardian match
    symbols:
      BTC/USD:
        max_deviation_bips: 300    # 3% deviation for BTC
        max_timestamp_age: 1800    # 30 minutes
        min_guardian_matches: 1
      ETH/USD:
        max_deviation_bips: 400    # 4% deviation for ETH
        max_timestamp_age: 2400    # 40 minutes
        min_guardian_matches: 1

  # Custom assets query the oracle via getValueByConfig with per-asset parameters.
  # parentAsset is used as the oracle query key, customName is used when publishing the intent.
  # customMethodology defaults to the priceMethodology fetched from the oracle at startup.
  # Only supported with dia_v2 client type.
  custom_assets:
    - custom_name: "BTC-window/USD"
      parent_asset: "BTC/USD"
      custom_window_size: 0              # 0 = use fetched default (100)
      custom_methodology: ""             # empty = use fetched default
      custom_timeout_seconds: 3600
      custom_threshold: 2
    - custom_name: "ETH-window/USD"
      parent_asset: "ETH/USD"
      custom_window_size: 50
      custom_methodology: ""
      custom_timeout_seconds: 3600
      custom_threshold: 2
      

# Logging Configuration
logging:
  level: info

# Metrics Configuration
metrics:
  port: 8080

# API Server Configuration
api:
  port: 8081

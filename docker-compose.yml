version: '3.8'

services:
  attestor:
    build:
      context: ./attestor
      dockerfile: Dockerfile
    container_name: oracle-attestor
    restart: unless-stopped
    environment:
      # Required environment variables
      - ATTESTOR_ATTESTOR_PRIVATE_KEY=${ATTESTOR_ATTESTOR_PRIVATE_KEY}
      - ATTESTOR_REGISTRY_ADDRESS=${ATTESTOR_REGISTRY_ADDRESS}
      
      # Optional environment variables with defaults
      - ATTESTOR_RPC_URL=${ATTESTOR_RPC_URL:-https://rpc-dia-lasernet-dipfsyyx2w.t.conduit.xyz}
      - ATTESTOR_RPC_REGISTRY_URL=${ATTESTOR_RPC_REGISTRY_URL:-https://rpc-dia-lasernet-dipfsyyx2w.t.conduit.xyz}
      - ATTESTOR_ORACLE_ADDRESS=${ATTESTOR_ORACLE_ADDRESS:-0x0087342f5f4c7AB23a37c045c3EF710749527c88}
      - ATTESTOR_ATTESTOR_SYMBOLS=${ATTESTOR_ATTESTOR_SYMBOLS:-BTC/USD,ETH/USD}
      - ATTESTOR_ATTESTOR_POLLING_TIME=${ATTESTOR_ATTESTOR_POLLING_TIME:-5s}
      - ATTESTOR_ATTESTOR_BATCH_MODE=${ATTESTOR_ATTESTOR_BATCH_MODE:-false}
      - ATTESTOR_LOGGING_LEVEL=${ATTESTOR_LOGGING_LEVEL:-info}
      - ATTESTOR_METRICS_PORT=${ATTESTOR_METRICS_PORT:-8080}
      - ATTESTOR_API_PORT=${ATTESTOR_API_PORT:-8081}
    ports:
      - "8080:8080"  # Prometheus metrics
      - "8081:8081"  # API server
    volumes:
      # Optional: Mount custom config file
      # - ./attestor/config.yaml:/app/config.yaml:ro
      
      # Optional: Mount for persistent logs
      # - ./logs/attestor:/app/logs
    networks:
      - oracle-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: oracle-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - oracle-network
    depends_on:
      - attestor

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: oracle-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - oracle-network
    depends_on:
      - prometheus

networks:
  oracle-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data: